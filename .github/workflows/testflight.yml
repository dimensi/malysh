name: TestFlight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/testflight.yml'
      - 'Scripts/simulator-id.py'
      - 'Scripts/tests/test_simulator_id.py'
      - 'Scripts/tests/test_testflight_delivery.rb'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'fastlane/**'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve and verify release source
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate release tag name
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release tag must match vX.Y.Z' >&2
            exit 1
          }

      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and main ancestry
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          [[ "$release_commit" == "$(git rev-parse HEAD)" ]] || {
            echo 'Checked-out commit must match the release tag' >&2
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_TYPE" == tag ]]
            [[ "$release_commit" == "$(git rev-parse --verify "${GITHUB_SHA}^{commit}")" ]]
          fi
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main || {
            echo 'Release commit must belong to origin/main' >&2
            exit 1
          }
          [[ -f fastlane/testflight_delivery.rb ]] || {
            echo 'This tag predates the delivery checks. Use its original release workflow.'
            exit 1
          }

      - name: Record source commit
        id: commit
        shell: bash
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Test on iPhone 18 Pro (${{ matrix.suite }})
    needs: source
    runs-on: xcode-27
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite: [app, profile-and-photos, system]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - name: Set up Ruby
        if: matrix.suite == 'app'
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Validate release tooling
        if: matrix.suite == 'app'
        run: |
          bundle exec fastlane lanes
          ruby Scripts/tests/test_testflight_delivery.rb
          python3 -m unittest discover -s Scripts/tests -p test_simulator_id.py

      - name: Boot iPhone 18 Pro on iOS 27.2
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Artifacts
          xcodebuild -version
          xcrun simctl list devices available -j > Artifacts/simulators.json
          SIMULATOR_ID="$(python3 Scripts/simulator-id.py --ci < Artifacts/simulators.json)"
          printf 'SIMULATOR_ID=%s\n' "$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b 2>&1 | tee Artifacts/simulator-boot.log

      - name: Run ${{ matrix.suite }} tests
        timeout-minutes: 35
        shell: bash
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          case "$TEST_SUITE" in
            app)
              selection=(
                -skip-testing:MalyshUITests/ProfileUITests
                -skip-testing:MalyshUITests/PhotoGalleryUITests
                -skip-testing:MalyshUITests/LiveActivityUITests
                -skip-testing:MalyshUITests/WidgetSystemUITests
              )
              ;;
            profile-and-photos)
              selection=(-only-testing:MalyshUITests/ProfileUITests -only-testing:MalyshUITests/PhotoGalleryUITests)
              ;;
            system)
              selection=(-only-testing:MalyshUITests/LiveActivityUITests -only-testing:MalyshUITests/WidgetSystemUITests)
              ;;
            *) exit 1 ;;
          esac
          xcodebuild \
            -workspace Malysh.xcworkspace \
            -scheme Malysh \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData/CI \
            -resultBundlePath Artifacts/Tests.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 \
            -maximum-test-execution-time-allowance 300 \
            -retry-tests-on-failure -test-iterations 2 -test-repetition-relaunch-enabled YES \
            "${selection[@]}" test 2>&1 | tee Artifacts/tests.log

      - name: Save test results and simulator logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-tests-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Artifacts/Tests.xcresult
            Artifacts/tests.log
            Artifacts/simulator-boot.log
            Artifacts/simulators.json
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Sign, upload and verify TestFlight
    needs: [source, test]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_DISABLE_COLORS: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out verified release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Install temporary signing material
        id: signing
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash Scripts/ci-signing.sh setup

      - name: Upload and verify TestFlight availability
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # Fastlane expects a tag ref. The tag and checked-out commit were verified above.
        run: GITHUB_REF_TYPE=tag bundle exec fastlane ios beta

      - name: Remove temporary signing material
        if: ${{ always() && (steps.signing.outcome == 'success' || steps.signing.outcome == 'failure') }}
        shell: bash
        run: bash Scripts/ci-signing.sh cleanup

      - name: Save release logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: Artifacts/BuildLogs/*.log
          if-no-files-found: ignore
          retention-days: 7
