name: TestFlight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  release:
    name: Test, sign and upload
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_DISABLE_COLORS: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate release tag name
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release tag must match vX.Y.Z' >&2
            exit 1
          }

      - name: Check out release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and main ancestry
        id: validate_release
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          [[ "$release_commit" == "$(git rev-parse HEAD)" ]] || {
            echo 'Checked-out commit must match the release tag' >&2
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_TYPE" == tag ]]
            [[ "$release_commit" == "$(git rev-parse --verify "${GITHUB_SHA}^{commit}")" ]]
          fi
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main || {
            echo 'Release commit must belong to origin/main' >&2
            exit 1
          }
          xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Boot an available iPhone simulator
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Artifacts
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 Scripts/simulator-id.py)"
          printf 'SIMULATOR_ID=%s\n' "$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b 2>&1 | tee Artifacts/simulator-boot.log

      - name: Test on an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace Malysh.xcworkspace \
            -scheme Malysh \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData/CI \
            -resultBundlePath Artifacts/Tests.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            -parallel-testing-enabled NO \
            test 2>&1 | tee Artifacts/tests.log

      - name: Install temporary signing material
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash Scripts/ci-signing.sh setup

      - name: Upload version to TestFlight
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # Fastlane expects a tag ref. The tag and checked-out commit were verified above.
        run: GITHUB_REF_TYPE=tag bundle exec fastlane ios beta

      - name: Remove temporary signing material
        if: ${{ always() && steps.validate_release.outcome == 'success' }}
        shell: bash
        run: bash Scripts/ci-signing.sh cleanup

      - name: Save test results and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testflight-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Artifacts/Tests.xcresult
            Artifacts/tests.log
            Artifacts/simulator-boot.log
            Artifacts/BuildLogs/*.log
          if-no-files-found: ignore
          retention-days: 7
